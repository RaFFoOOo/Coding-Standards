name: Shared .NET Build

on:
  workflow_call:
    inputs:
      runner:
        description: 'Where to execute. "ubuntu-latest" = GitHub-hosted (bills Actions minutes); "self-hosted" = your own runner (free). Callers compute this; see stack-github-actions.md §8.'
        required: false
        type: string
        default: 'ubuntu-latest'
      dotnet-version:
        description: 'Version of .NET SDK to use'
        required: false
        type: string
        default: '10.x'
      working-directory:
        description: 'Directory containing the .sln file (relative to repo root)'
        required: false
        type: string
        default: 'lc-services'
      run-tests:
        description: 'Whether to run dotnet test after building. Set true for CI, false for CD.'
        required: false
        type: boolean
        default: false
      publish:
        description: 'Whether to run dotnet publish and upload the artifact. Set true for CD, false for CI.'
        required: false
        type: boolean
        default: false
      run-guards:
        description: 'Whether to run the repo guards that need the .NET SDK (schema drift) plus the cheap bash guards that ride along. CI sets true; CD omits — a deploy must not be gated on repo hygiene.'
        required: false
        type: boolean
        default: false
      publish-project:
        description: 'Path to the project to publish, relative to working-directory. Required when publish: true.'
        required: false
        type: string
        default: 'LcServices.Functions/LcServices.Functions.csproj'

jobs:
  build:
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

        # Self-hosted runners run as an unprivileged user, and `setup-dotnet` installs into
        # `/usr/share/dotnet` by default — root-owned, so the install dies with
        # "mkdir: cannot create directory '/usr/share/dotnet': Permission denied" (observed on
        # run 32716414855, 2026-08-24). `runner.temp` is writable by the runner on BOTH
        # GitHub-hosted and self-hosted, so this needs no conditional.
        # Cost: the SDK is re-fetched per job rather than reused. Measured on GitHub-hosted, this
        # step already took 9-12 s doing its own install, so the hosted path is not meaningfully
        # worse. If it proves slow on the laptop, point this at a path that survives between jobs.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      - name: Restore dependencies
        run: dotnet restore

      - name: Audit .NET dependencies
        # OWASP A06 — fail on any HIGH/CRITICAL CVE; see stack-github-actions.md §6
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee /tmp/vuln.txt
          if grep -qiE "(High|Critical)" /tmp/vuln.txt; then
            echo "::error::HIGH or CRITICAL vulnerability detected in .NET packages"
            exit 1
          fi

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        # Integration tests spin up a SQL Server container via Testcontainers —
        # Docker is pre-installed on ubuntu-latest runners; no extra setup needed.
        if: inputs.run-tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      # ── Repo guards (CI only) ────────────────────────────────────────────────────────────────
      # Folded in from ci-backend.yml's former `schema-drift` job (2026-08-26). That job repeated
      # this one's Setup .NET (61 s) and dotnet restore (28 s) purely to reach the same state, and
      # `dotnet ef migrations script` then rebuilt LcServices.DataAccess a second time. Riding on
      # this job's restore removes ~89 s/PR outright and one redundant compile.
      #
      # These scripts run from the REPO ROOT (check-schema-drift.sh hardcodes SERVICES_DIR=
      # "lc-services"), so each overrides the job-level working-directory.
      - name: Check schema.sql drift
        if: inputs.run-guards
        working-directory: .
        run: bash scripts/ci/check-schema-drift.sh

      # EVERY OTHER GUARD MOVED OUT on 2026-09-01, to validate-archive.yml's `guards` job.
      #
      # `check-schema-drift.sh` is the only one that stays, and the reason is the rule for what
      # belongs here: it needs the .NET SDK and the local dotnet-ef tool, which this job already
      # has. The nine that left are pure bash and needed none of it.
      #
      # What the old shape actually cost. A workflow's trigger must be the union of its jobs'
      # inputs, so hosting bash guards here forced ci-backend.yml to list SIX frontend paths —
      # `lc-webapp/src/assets/i18n/**` among them. An i18n key edit therefore ran a full .NET
      # restore + build + 517 tests to reach a grep: measured at 7m38s on #852, a PR touching zero
      # backend files. Four of the guards additionally ran in ci-angular too, so a both-stacks PR
      # executed them twice.
      #
      # The comments removed with those steps argued that the duplication was necessary — "either
      # workflow alone would leave the other stack's PRs unscanned". That premise was true and the
      # conclusion did not follow: a guard reading BOTH stacks belongs in NEITHER stack's build.
      # One stack-neutral job, triggered by both trees, scans everything once. The duplication was
      # a symptom of the placement, not a requirement of the guards.

      - name: Publish
        if: inputs.publish
        run: |
          # Version stamp — same format as the frontend build-tag (shared-build-angular.yml):
          # <prefix>-YYYYMMDD-HHMM-<branch>. Surfaced by GET /v1/version (VersionFunction reads
          # InformationalVersion and trims the +commit suffix the SDK appends). Distinct
          # 'cd-azure-func' prefix so the footer's api version is visibly the backend pipeline.
          BRANCH="${{ github.ref_name }}"
          BUILD_TAG="cd-azure-func-$(date +'%Y%m%d-%H%M')-${BRANCH//\//-}"
          dotnet publish "${{ inputs.publish-project }}" \
            --configuration Release \
            -p:InformationalVersion="$BUILD_TAG" \
            --output "$GITHUB_WORKSPACE/publish"

          # Merge .azurefunctions/ into the publish output — required by Functions host v4.1000+.
          # The SDK generates this folder in the build OutputPath; some SDK versions also emit it
          # directly under --output, others don't. Merge contents (trailing "/." on the source,
          # mkdir -p + trailing "/" on the destination) rather than `cp -r SRC DST`, which nests
          # into DST/.azurefunctions/.azurefunctions when DST already exists — confirmed in a
          # 2026-07-04 CD run's publish.zip listing (harmless bloat here, but never correct).
          PROJ_DIR=$(dirname "${{ inputs.publish-project }}")
          AZFUNC_SRC="$PROJ_DIR/bin/Release/net10.0/.azurefunctions"
          if [ -d "$AZFUNC_SRC" ]; then
            mkdir -p "$GITHUB_WORKSPACE/publish/.azurefunctions"
            cp -r "$AZFUNC_SRC/." "$GITHUB_WORKSPACE/publish/.azurefunctions/"
          fi

      - name: Upload Build Artifact
        if: inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-publish-output
          path: ${{ github.workspace }}/publish
          retention-days: 1
          # Required so the .azurefunctions/ folder (dot-prefixed, treated as hidden by
          # upload-artifact) is shipped with the rest of the publish output.
          include-hidden-files: true
