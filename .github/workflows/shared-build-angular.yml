name: Shared Angular Build

on:
  workflow_call:
    inputs:
      runner:
        description: 'Where to execute. "ubuntu-latest" = GitHub-hosted (bills Actions minutes); "self-hosted" = your own runner (free). Callers compute this; see stack-github-actions.md §8.'
        required: false
        type: string
        default: 'ubuntu-latest'
      node-version:
        description: 'Version of Node.js to use'
        required: false
        type: string
        default: '24'
      working-directory:
        description: 'Directory containing the project package.json'
        required: false
        type: string
        default: '.'
      environment:
        description: |
          Angular CLI configuration name (passed as `--configuration <value>`),
          NOT a GitHub environment scope. Maps to angular.json configurations
          and the matching `src/environments/environment.<value>.ts` file
          replacement. Use `production` for any deployed bundle (optimized,
          minified) and `development` only for unoptimized CI / local builds.
        required: false
        type: string
        default: 'production'
      deploy-tag-prefix:
        description: 'Prefix for the generated build version tag (e.g., cd-azure-sta, cd-azure-swa). Defaults to build.'
        required: false
        type: string
        default: 'build'
      deploy-tag-suffix:
        description: 'Optional suffix appended after the date segment (e.g., branch name). Tag format: <prefix>-<date>-<suffix>.'
        required: false
        type: string
        default: ''
      upload-artifact:
        description: 'Whether to upload the build artifact. Set to false for pure CI validation runs that do not need to deploy.'
        required: false
        type: boolean
        default: true
      run-lint:
        description: 'Whether to run `ng lint`. CI sets true; CD omits (false) — a deploy must not be gated on style.'
        required: false
        type: boolean
        default: false
      run-tests:
        description: 'Whether to run the unit test suite (ng test). CI sets true; CD omits (false).'
        required: false
        type: boolean
        default: false
    outputs:
      build-tag:
        description: 'The generated build version tag (e.g., cd-azure-swa-20260330-1430-main)'
        value: ${{ jobs.build.outputs.build-tag }}

jobs:
  build:
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      build-tag: ${{ steps.generate-tag.outputs.build-tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        # A self-hosted runner keeps ~/.npm between runs (4.1 GB on RaFFoOOo's box), so restoring
        # the Actions npm cache there downloads ~1013 MB over the network to duplicate a directory
        # that is already populated — measured at 218 s + 274 s across this PR's two Angular jobs,
        # i.e. ~8 min per PR for nothing. A GitHub-hosted runner is ephemeral and genuinely needs it.
        # `runner.environment` resolves ON the runner, so this is correct however the runner was
        # chosen (dispatch input, vars.CI_RUNNER, or the ubuntu-latest fallback).
        #
        # BOTH inputs are required. Clearing `cache` alone does nothing: setup-node falls through to
        # `else if (packagemanagercache)`, which DEFAULTS TO TRUE and re-derives the manager from
        # package.json's `packageManager` field ("npm@11.6.2" here) — restoring the identical cache.
        # Verified against actions/setup-node@v7 src/main.ts, not inferred.
        # NOTE the direction of this ternary. `A && B || C` collapses to C whenever B is falsy
        # (stack-github-actions.md §8.1), so the obvious form — `== 'self-hosted' && '' || 'npm'` —
        # has an EMPTY STRING as B and therefore always yields 'npm', silently leaving the cache on.
        # That exact version shipped in this PR's first commit and measured 190 s, i.e. unchanged.
        # Inverted so B is 'npm' (truthy) and the falsy branch is the one that disables.
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
          cache-dependency-path: '${{ inputs.working-directory }}/package-lock.json'
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}

      - name: Install Dependencies
        # --legacy-peer-deps required: @angular/build@21.2.11 declares typescript@">=5.9 <6.0"
        # (conservative/lagging range); @angular/compiler-cli accepts >=5.9 <6.1 (authoritative).
        # ng update uses legacy resolution locally; npm ci in npm v10 ignores .npmrc for ERESOLVE.
        run: npm ci --legacy-peer-deps

      # Placed BEFORE the tests and the build, deliberately: lint is 70 s against their combined
      # 203 s, so failing here first is the cheapest possible failure. Folded into this job rather
      # than taking its own, and the arithmetic (stack-github-actions.md §7.1) is why — measured on
      # run 32955607380 at 182 ci-angular PR runs per fortnight:
      #
      #   this job today            280 s -> 5 billed min
      #   with lint folded in       350 s -> 6 billed min   (+1 per run)
      #   lint as its OWN job       ~135 s -> 3 billed min   (+3 per run, checkout + node + npm ci)
      #
      # So folding is 3x cheaper — NOT free, which an earlier version of this plan claimed. Adding
      # 70 s crosses a whole-minute boundary. On a self-hosted runner both cost zero Actions minutes;
      # this arithmetic governs the GitHub-hosted fallback.
      - name: Lint
        if: inputs.run-lint
        run: npm run lint

      - name: Run Unit Tests
        if: inputs.run-tests
        run: npm test

      - name: Generate Build Tag
        id: generate-tag
        run: |
          TAG="${{ inputs.deploy-tag-prefix }}-$(date +'%Y%m%d-%H%M')"
          SUFFIX="${{ inputs.deploy-tag-suffix }}"
          if [ -n "$SUFFIX" ]; then
            # Sanitize: replace slashes with hyphens for git-tag and URL safety
            SUFFIX=$(echo "$SUFFIX" | tr '/' '-')
            TAG="${TAG}-${SUFFIX}"
          fi
          echo "build-tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "BUILD_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Build Application
        run: npm run build -- --configuration ${{ inputs.environment }}

      # Last, so a registry outage cannot hide lint, tests and build; before the upload, so a tree
      # with a known CVE publishes nothing (`stack-github-actions.md` §6). A transport failure still
      # fails the step — it only gets a message saying it is not a finding.
      - name: Audit npm dependencies
        run: |
          status=0
          npm audit --audit-level=moderate > "$RUNNER_TEMP/npm-audit.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/npm-audit.log"
          if [ "$status" -ne 0 ] && grep -q 'audit endpoint returned an error' "$RUNNER_TEMP/npm-audit.log"; then
            echo "::error::npm registry unreachable — this is not a CVE finding. Re-run the job."
          fi
          exit "$status"

      - name: Upload Build Artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: angular-build-output
          path: ${{ inputs.working-directory }}/dist/
          retention-days: 1
